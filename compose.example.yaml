# Single-file setup. Easier: `crb add` creates compose.yaml, box.yaml and
# one file per project in services/ for you (see README, "Quick start").
# Copy to compose.yaml and add one service per project.
# Each project gets its own container, Remote Control environment and config directory.
# Create each config directory before the first start (Docker would create it owned by root):
#   mkdir -p ./my-project/config && chmod 700 ./my-project/config
# Then start it and run the guided setup:
#   docker compose up -d my-project && docker compose exec -it my-project setup

x-box: &box
  image: ghcr.io/marc2016/claude-remote-box:1.0.1
  restart: unless-stopped
  user: "${UID:-1000}:${GID:-1000}"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  ulimits:
    core: 0                       # no core dumps in /workspace, also for `exec` shells
  # No ports and no Docker socket: Remote Control only needs outbound HTTPS.

services:
  my-project:
    <<: *box
    environment:
      CRB_NAME: my-project        # environment name in the Claude app
      # CRB_SPAWN: worktree       # default: worktree for Git projects, else same-dir
      # CRB_STATUS_URL: http://crb-dashboard:8080/api/ingest   # report phase and session activity, see README
      # CRB_STATUS_TOKEN: change-me
      # CRB_EXTRA_ARGS: --permission-mode auto   # crb add asks for this; default asks before most actions
      # GIT_AUTHOR_NAME: Your Name
      # GIT_AUTHOR_EMAIL: you@example.com
      # GIT_COMMITTER_NAME: Your Name
      # GIT_COMMITTER_EMAIL: you@example.com
    volumes:
      - ~/code/my-project:/workspace
      - ./my-project/config:/home/node/.claude   # login token: keep it chmod 700
      # Optional: keeps browsers for screenshots across recreation (one volume per project)
      - my-project-browsers:/home/node/.cache/ms-playwright

  # another-project:
  #   <<: *box
  #   environment:
  #     CRB_NAME: another-project
  #   volumes:
  #     - ~/code/another-project:/workspace
  #     - ./another-project/config:/home/node/.claude
  #     - another-project-browsers:/home/node/.cache/ms-playwright

  # Status dashboard (see README, "Status dashboard"). Needs CRB_STATUS_TOKEN
  # in .env and the two CRB_STATUS_* lines on every box above. The page is
  # locked until a passkey exists: set CRB_DASHBOARD_URL in .env, then
  # docker compose exec crb-dashboard node server/admin.js enroll
  # crb-dashboard:
  #   image: ghcr.io/marc2016/claude-remote-box-dashboard:latest
  #   restart: unless-stopped
  #   user: "${UID:-1000}:${GID:-1000}"
  #   cap_drop: [ALL]
  #   security_opt: [no-new-privileges:true]
  #   environment:
  #     CRB_STATUS_TOKEN: "${CRB_STATUS_TOKEN}"
  #     CRB_DASHBOARD_URL: "${CRB_DASHBOARD_URL:-}"                      # public https address; passkeys are bound to it
  #     CRB_DASHBOARD_PROXY: "${CRB_DASHBOARD_PROXY:-}"                  # address of the reverse proxy
  #     CRB_DASHBOARD_AUTH: "${CRB_DASHBOARD_AUTH:-}"                    # off: no login (private network only)
  #     CRB_DASHBOARD_REMOTE_INGEST: "${CRB_DASHBOARD_REMOTE_INGEST:-}"  # 1: accept box reports through the proxy
  #   ports:
  #     - "${CRB_DASHBOARD_BIND:-127.0.0.1:8080}:8080"
  #   volumes:
  #     - crb-dashboard-data:/data

volumes:
  my-project-browsers:
