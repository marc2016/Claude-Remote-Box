name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile is the single source of truth for the Claude Code version.
      - name: Read Claude Code version
        id: version
        run: echo "claude=$(sed -n 's/^ARG CLAUDE_CODE_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/claude-remote-box:${{ steps.version.outputs.claude }}
            ghcr.io/${{ github.repository_owner }}/claude-remote-box:latest
          # Links the package to this repository on GHCR.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Claude Code in a hardened Compose service, driven from your phone via Remote Control
            org.opencontainers.image.licenses=MIT
