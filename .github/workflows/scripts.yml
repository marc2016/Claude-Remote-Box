name: scripts

# Lints and tests the host scripts. Needs only git and Docker Compose
# (for `docker compose config`); no containers are started.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck crb tests/crb.test.sh

      - name: Compose version
        run: docker compose version

      - name: crb tests
        run: tests/crb.test.sh
